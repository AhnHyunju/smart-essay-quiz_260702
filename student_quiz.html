<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 서술형 평가 연습 창</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .quiz-wrapper {
            max-width: 1280px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .guide-container {
            flex: 1;
            min-width: 320px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .final-container {
            flex: 1;
            min-width: 320px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            display: flex;
            flex-direction: column;
        }

        .student-info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-label {
            font-weight: bold;
            color: #334155;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-field,
        .info-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .info-input {
            margin-bottom: 10px;
        }

        .connector-badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin: 4px;
            cursor: pointer;
            border: 1px solid #bae6fd;
        }

        .connector-badge:hover {
            background: #0284c7;
            color: white;
        }

        .final-textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #94a3b8;
            resize: none;
            box-sizing: border-box;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .edit-notice {
            font-size: 12px;
            color: #64748b;
            margin: -8px 0 12px;
        }

        .q-tab {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
            border-radius: 16px;
            padding: 6px 13px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .q-tab.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        .q-tab.done::after {
            content: ' ✓';
            color: #4ade80;
        }

        .submit-btn,
        .action-btn {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            background-color: #172554;
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .auth-panel {
            text-align: center;
            padding: 40px 20px;
        }

        .hidden {
            display: none !important;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .standard-btn {
            background-color: #10b981;
            margin-bottom: 15px;
        }

        /* ── 이탈 경고 배너 ── */
        .warning-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #dc2626;
            color: white;
            font-weight: bold;
            text-align: center;
            padding: 14px 10px;
            font-size: 15px;
            z-index: 2000;
            box-sizing: border-box;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
            transform: translateY(-100%);
            transition: transform 0.3s ease;
        }

        .warning-banner.show {
            transform: translateY(0);
        }

        /* 응시 상태 표시등 */
        .focus-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .focus-status.away {
            background: #fef2f2;
            color: #b91c1c;
            border-color: #fecaca;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
        }

        .focus-status.away .status-dot {
            background: #dc2626;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.2;
            }
        }

        /* ── 성취기준 → 성취수준(A~E) 펼침 ── */
        .std-title { margin: 0 0 8px; font-size: 15px; color: #0f172a; word-break: keep-all; }
        .std-hint {
            margin: 0 0 12px; padding: 9px 11px; background: #ecfdf5;
            border: 1px solid #a7f3d0; border-radius: 8px; color: #065f46;
            font-size: 13px; line-height: 1.5;
        }
        .std-tabs { display: flex; gap: 6px; margin: 0 0 10px; }
        .std-tab {
            flex: 1; padding: 10px 6px; border: 1px solid #cbd5e1; background: #fff;
            color: #334155; border-radius: 8px; font-size: 14px; font-weight: bold;
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .std-tab.active { background: #1e3a8a; border-color: #1e3a8a; color: #fff; }
        .std-tools { display: flex; gap: 6px; margin: 0 0 4px; justify-content: flex-end; }
        .std-tool {
            border: 1px solid #cbd5e1; background: #fff; color: #475569; border-radius: 6px;
            font-size: 12px; padding: 5px 10px; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .std-group.is-hidden { display: none; }
        .std-area-title { margin: 14px 0 6px; font-size: 14px; color: #0f172a; }

        .std-item {
            border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc;
            margin-bottom: 8px; overflow: hidden;
        }
        .std-item[open] { border-color: #10b981; background: #fff; }
        .std-item > summary {
            list-style: none; cursor: pointer; display: block; padding: 11px 12px;
            -webkit-tap-highlight-color: transparent;
        }
        .std-item > summary::-webkit-details-marker { display: none; }
        .std-text { line-height: 1.55; }
        .std-code { color: #1e40af; font-weight: bold; }
        .std-cta-row { margin-top: 8px; }
        .std-cta {
            display: inline-flex; align-items: center; gap: 6px; background: #10b981;
            color: #fff; font-size: 12.5px; font-weight: bold; padding: 7px 13px;
            border-radius: 999px; user-select: none;
        }
        .std-cta::after { content: '▾'; transition: transform 0.2s ease; }
        .std-item[open] .std-cta { background: #059669; }
        .std-item[open] .std-cta::after { transform: rotate(180deg); }
        .cta-open { display: none; }
        .std-item[open] .cta-open { display: inline; }
        .std-item[open] .cta-closed { display: none; }

        .level-list { list-style: none; margin: 0; padding: 2px 12px 8px; border-top: 1px dashed #cbd5e1; }
        .level-row { display: flex; gap: 9px; padding: 8px 0; border-top: 1px dashed #e2e8f0; align-items: flex-start; }
        .level-row:first-child { border-top: none; }
        .level-badge {
            flex: none; width: 24px; height: 24px; border-radius: 50%; background: #1e3a8a;
            color: #fff; font-size: 12px; font-weight: bold; display: flex;
            align-items: center; justify-content: center; margin-top: 1px;
        }
        .level-text { flex: 1; font-size: 13.5px; line-height: 1.55; word-break: keep-all; }

        /* ── 모바일 최적화 ── */
        @media (max-width: 640px) {
            .modal { padding: 10px; box-sizing: border-box; }
            .modal-content { padding: 16px; max-height: 88vh; max-height: 88dvh; border-radius: 12px; }
            .std-cta-row .std-cta { display: flex; justify-content: space-between; width: 100%; box-sizing: border-box; padding: 10px 14px; font-size: 13.5px; }
            .std-tab { padding: 12px 6px; }
            .quiz-wrapper { padding: 16px; border-radius: 12px; }
            .student-info-grid { grid-template-columns: repeat(2, 1fr); }
            .final-textarea { height: 170px; }
        }
    </style>
</head>

<body>

    <!-- 이탈 경고 배너 -->
    <div id="warning-banner" class="warning-banner">
        ⚠️ 시험 화면 이탈이 감지되었습니다! (누적 <span id="away-count-display">0</span>회)
        — 이탈 기록은 선생님 대시보드에 실시간으로 표시됩니다.
    </div>

    <div class="quiz-wrapper">
        <!-- 로그인 화면 -->
        <div id="login-section" class="auth-panel">
            <h2 style="color:#1e3a8a;"><i class="fa-solid fa-lock"></i> 학생 본인 확인 인증</h2>
            <p>서술형 시험실에 입장하기 위해 구글 로그인을 진행해 주세요.</p>
            <button class="submit-btn" style="max-width:300px; margin-top:20px;" id="login-btn">
                <i class="fa-brands fa-google"></i> Google 계정으로 로그인
            </button>
        </div>

        <!-- 시험 화면 -->
        <div id="quiz-section" class="hidden">
            <div class="header-box">
                <h2 style="margin:0; color:#1e3a8a;">
                    <i class="fa-solid fa-graduation-cap"></i> AI 서술형 평가실
                    (<span id="subject-display">과목</span>)
                </h2>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span class="focus-status" id="focus-status">
                        <span class="status-dot"></span><span id="focus-status-text">응시 중</span>
                    </span>
                    <button class="action-btn standard-btn" style="width:auto; padding:8px 15px; margin:0;"
                        id="standard-btn">
                        <i class="fa-solid fa-bookmark"></i> 성취기준/수준 보기
                    </button>
                </div>
            </div>

            <div class="student-info-grid">
                <div>
                    <label class="input-label" for="s-grade">학년</label>
                    <input type="number" id="s-grade" class="info-input" placeholder="예: 1" min="1" max="3">
                </div>
                <div>
                    <label class="input-label" for="s-class">학과 / 반</label>
                    <input type="text" id="s-class" class="info-input" placeholder="예: 3반">
                </div>
                <div>
                    <label class="input-label" for="s-number">번호</label>
                    <input type="number" id="s-number" class="info-input" placeholder="예: 15" min="1">
                </div>
                <div>
                    <label class="input-label" for="s-name">이름 (본명)</label>
                    <input type="text" id="s-name" class="info-input" placeholder="본명 입력 (예: 홍길동)">
                </div>
            </div>

            <div class="main-layout">
                <!-- 왼쪽: 단계별 가이드 -->
                <div class="guide-container">
                    <h3 style="margin-top:0; color:#0f172a;">
                        <i class="fa-solid fa-lightbulb" style="color:#eab308;"></i> 단계별 생각 가이드
                    </h3>

                    <label class="input-label" for="step1">1단계: 핵심 주장 및 결론 적기</label>
                    <input type="text" id="step1" class="input-field step-input" placeholder="문항에 대한 나의 핵심 주장을 한 문장으로 적으세요.">

                    <label class="input-label" for="step2" style="margin-top:10px;">2단계: 근거 제시하기</label>
                    <input type="text" id="step2" class="input-field step-input" placeholder="왜 그렇게 생각하는지 근거를 적으세요.">

                    <label class="input-label" for="step3" style="margin-top:10px;">3단계: 구체적 예시·사례 들기</label>
                    <input type="text" id="step3" class="input-field step-input" placeholder="근거를 뒷받침하는 실제 사례나 예시를 적으세요.">

                    <label class="input-label" for="step4" style="margin-top:10px;">4단계: 다른 측면·반대 입장 고려하기</label>
                    <input type="text" id="step4" class="input-field step-input" placeholder="반대 측면이나 함께 고려할 점을 적으세요.">

                    <label class="input-label" for="step5" style="margin-top:10px;">5단계: 종합하여 마무리하기</label>
                    <input type="text" id="step5" class="input-field step-input" placeholder="전체 내용을 종합한 결론을 적으세요.">

                    <div
                        style="background:#eff6ff; padding:15px; border-radius:8px; border:1px solid #bfdbfe; margin-top:20px;">
                        <h4 style="margin-top:0; color:#1e40af;">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> 추천 연결어 힌트
                        </h4>
                        <div id="connectors">
                            <span class="connector-badge">왜냐하면</span>
                            <span class="connector-badge">예를 들어</span>
                            <span class="connector-badge">반면에</span>
                            <span class="connector-badge">따라서</span>
                            <span class="connector-badge">그 결과,</span>
                        </div>
                    </div>
                </div>

                <!-- 오른쪽: 최종 답안 -->
                <div class="final-container">
                    <h3 style="margin-top:0; color:#0f172a;">
                        <i class="fa-solid fa-file-pen" style="color:#2563eb;"></i> 최종 답안 제출란
                    </h3>
                    <div id="question-tabs" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;"></div>
                    <div style="background:#f1f5f9; padding:12px; border-radius:6px; font-weight:bold; margin-bottom:15px;"
                        id="question-text">
                        [문항] 문항을 불러오는 중입니다...
                    </div>
                    <textarea id="student-answer" class="final-textarea"
                        placeholder="1~5단계 내용이 이곳에 실시간으로 결합됩니다. 문맥에 맞게 최종 수정해 주세요..."></textarea>
                    <p class="edit-notice" id="edit-notice" style="display:none;">
                        ✍️ 직접 수정을 시작했어요. 이제 단계 입력을 고쳐도 이 답안은 덮어쓰지 않습니다.
                    </p>
                    <button class="submit-btn" id="submit-btn">
                        <i class="fa-solid fa-paper-plane"></i> 최종 답안 제출하기
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 성취기준 모달 -->
    <div id="standard-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="color:#1e3a8a; margin-top:0;" id="modal-title">🎯 과목 교육과정 안내</h3>
            <div id="modal-body" style="line-height:1.6; font-size:14px; color:#334155;"></div>
            <button class="action-btn" style="margin-top:20px; background:#64748b;" id="modal-close-btn">닫기</button>
        </div>
    </div>

    <script>
        /* ═════════════════════════════════
           1. 과목별 데이터 (문항 / 성취기준 A~E)
        ═════════════════════════════════ */

탐색하고 해당 문화권의 특징과 삶의 방식을 파악할 수 있다.","E":"주어진 사례에 나타난 문화권의 특징과 삶의 방식을 말할 수 있다."}},{"code":"10통사1-04-02","desc":"문화 변동의 다양한 양상을 이해하고, 현대 사회에서 전통문화가 지니는 의의를 탐색한다.","levels":{"A":"문화병존, 문화융합, 문화동화의 구체적인 사례들을 조사하여 유형화하며 다양한 문화 변동의 양상을 설명하고, 현대 사회에서 전통문화가 가지는 의의를 이해하고 이를 존중하는 태도를 갖추며 전통문화를 창조적으로 계승·발전시킬 방안을 제안할 수 있다.","B":"문화 변동의 구체적인 사례들을 조사하여 다양한 문화 변동의 양상을 설명하고, 전통문화에 대한 이해와 존중의 태도를 갖추며 현대 사회에서 전통문화를 계승·발전시킬 방안을 탐색할 수 있다.","C":"문화 변동의 사례들을 조사하여 문화 변동이 다양한 양상으로 나타남을 이해하고, 현대 사회에서 전통문화가 가진 의의를 설명할 수 있다.","D":"문화 변동의 다양한 양상을 나열하고, 전통문화가 가진 의의를 설명할 수 있다.","E":"문화 변동과 전통문화의 의미를 사례와 함께 말할 수 있다."}},{"code":"10통사1-04-03","desc":"문화적 차이에 대한 상대주의적 태도의 필요성을 이해하고, 보편 윤리의 차원에서 자문화와 타문화를 평가한다.","levels":{"A":"지역에 따른 문화적 차이가 나타나는 자료를 조사하여 문화적 차이가 발생하는 배경과 맥락을 분석하고, 다양성을 인정하는 문화 상대주의적 태도의 필요성을 설명하며 보편 윤리의 기준을 적용하여 자문화와 타문화를 균형있게 평가할 수 있다.","B":"지역에 따라 문화적 차이가 발생하는 맥락을 분석하여 다양성을 인정하는 문화 상대주의적 태도의 필요성을 설명하고, 보편 윤리의 차원에서 자문화와 타문화를 평가할 수 있다.","C":"문화적 차이를 보여주는 사례를 통해 문화 상대주의적 태도의 의미와 필요성을 설명하고, 자문화와 타문화를 평가할 때 보편 윤리에 따른 기준을 적용할 수 있다.","D":"문화 상대주의적 태도의 의미와 필요성을 파악하고, 자문화와 타문화를 평가할 때 필요한 보편 윤리를 설명할 수 있다.","E":"문화를 평가할 때 필요한 문화 상대주의적 태도와 보편 윤리의 의미를 말할 수 있다."}},{"code":"10통사1-04-04","desc":"다문화 사회의 현황을 조사하고, 문화적 다양성을 존중하는 태도를 바탕으로 갈등 해결 방안을 모색한다.","levels":{"A":"다문화 사회의 현황을 보여주는 자료를 조사하여 다문화 사회가 지니는 다양한 양상을 다각도로 분석하고, 문화적 차이로 발생하는 갈등의 양상을 파악하여 해결 방안을 제안하며, 이 과정에서 문화적 다양성과 인권을 존중하는 태도를 내면화하고 이를 생활 속에서 실천한다.","B":"자료 조사를 통해 다문화 사회의 다양한 양상을 파악하고, 문화적 차이로 발생하는 갈등의 양상에 대해 해결 방안을 제안하며 이 과정에서 문화적 다양성을 이해하고 존중하는 태도를 가진다.","C":"다문화 사회에서 문화적 차이로 갈등이 발생한 사례를 조사하고 해결 방안을 모색하는 과정에서 문화적 다양성을 존중하는 태도의 필요성을 설명할 수 있다.","D":"다문화 사회에서 발생한 갈등 사례를 찾고, 갈등 해결을 위해 문화적 다양성을 존중하는 태도가 필요함을 말할 수 있다.","E":"다문화 사회의 의미를 알고, 문화적 다양성을 존중하는 태도가 필요함을 말할 수 있다."}}]},{"area":"생활공간의 변화","items":[{"code":"10통사1-05-01","desc":"산업화, 도시화로 인해 나타난 생활공간과 생활양식의 변화 양상을 조사하고, 이에 따른 문제점의 해결 방안을 제안한다.","levels":{"A":"산업화, 도시화로 인해 나타난 생활공간과 생활양식의 변화 양상을 다각적으로 조사, 분석하여 삶에 미친 영향을 그림, 지도, 도식 등을 활용하여 시각화하고, 이에 따른 문제점을 조사하고 해결 방안을 지역적 및 국가적 차원에서 모색         function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        /* 성취기준(요약줄)을 누르면 A~E 성취수준이 펼쳐진다. 펼쳐도 성취기준은 위에 그대로 보인다. */
        function buildAchievementHtml(subject, groups) {
            let h = `<p class="std-title"><strong>📚 2022 개정 교육과정 ${escapeHtml(subject)} 성취기준·성취수준</strong></p>`;
            h += `<p class="std-hint">👆 <strong>성취기준을 눌러</strong> A~E 성취수준을 확인하세요.<br>A가 가장 높은 수준입니다. 목표 수준에 맞게 주장·근거·사례를 담아 답안을 써 보세요.</p>`;
            if (groups.length > 1) {
                h += '<div class="std-tabs">' + groups.map((g, i) =>
                    `<button type="button" class="std-tab${i === 0 ? ' active' : ''}" onclick="switchStdTab(${i})">${escapeHtml(g.title)}</button>`
                ).join('') + '</div>';
            }
            h += `<div class="std-tools"><button type="button" class="std-tool" onclick="toggleAllStd(true)">모두 펼치기</button><button type="button" class="std-tool" onclick="toggleAllStd(false)">모두 접기</button></div>`;
            groups.forEach((g, gi) => {
                h += `<div class="std-group${gi === 0 ? '' : ' is-hidden'}" data-group="${gi}">`;
                g.areas.forEach((area) => {
                    h += `<p class="std-area-title"><strong>◾ ${escapeHtml(area.area)}</strong></p>`;
                    area.items.forEach((item) => {
                        const rows = ['A', 'B', 'C', 'D', 'E'].map((k) =>
                            `<li class="level-row"><span class="level-badge">${k}</span><span class="level-text">${escapeHtml(item.levels[k])}</span></li>`
                        ).join('');
                        h += `<details class="std-item"><summary>`
                            + `<div class="std-text"><span class="std-code">[${escapeHtml(item.code)}]</span> ${escapeHtml(item.desc)}</div>`
                            + `<div class="std-cta-row"><span class="std-cta"><span class="cta-closed">성취수준 A~E 보기</span><span class="cta-open">성취수준 A~E 접기</span></span></div>`
                            + `</summary><ul class="level-list">${rows}</ul></details>`;
                    });
                });
                h += '</div>';
            });
            return h;
        }

        function switchStdTab(idx) {
            document.querySelectorAll('#modal-body .std-tab').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('#modal-body .std-group').forEach((g) => g.classList.toggle('is-hidden', Number(g.dataset.group) !== idx));
            const box = document.querySelector('#standard-modal .modal-content');
            if (box) box.scrollTop = 0;
        }

        function toggleAllStd(open) {
            document.querySelectorAll('#modal-body .std-group:not(.is-hidden) details.std-item').forEach((d) => { d.open = open; });
        }

eight:bold;">[12사문03-01]</span> 대중문화에 대한 다양한 관점을 비교하고, 일상적으로 접하는 사례를 중심으로 대중문화가 개인과 사회에 미치는 영향을 토의한다.</li><li style="margin-bottom:4px;"><span style="color:#1e40af; font-weight:bold;">[12사문03-02]</span> 미디어의 효과에 대한 이해를 바탕으로 미디어가 생산하는 메시지를 비판적으로 분석하고 대안적 메시지 생산에 능동적으로 참여한다.</li><li style="margin-bottom:4px;"><span style="color:#1e40af; font-weight:bold;">[12사문03-03]</span> 하위문화와 주류 문화의 관계에 대한 이해를 바탕으로 다문화 사회의 이주민 문화에 대한 서로 다른 관점을 비교하고, 이주민 문화가 갖는 의의에 기초하여 문화 다양성을 증진하기 위한 방안을 제시한다.</li><li style="margin-bottom:4px;"><span style="color:#1e40af; font-weight:bold;">[12사문03-04]</span> 문화 변동의 다양한 요인과 양상, 문화 변동 과정에서 발생하는 문제점을 이해하고, 문화의 세계화로 인해 나타나는 쟁점에 대해 탐구한다.</li></ul><p style="margin:10px 0 4px;"><strong>◾ 사회 불평등과 사회 복지</strong></p><ul style="margin:0; padding-left:18px;"><li style="margin-bottom:4px;"><span style="color:#1e40af; font-weight:bold;">[12사문04-01]</span> 사회 불평등 현상을 이해하는 서로 다른 관점을 비교하고, 사회 이동과 사회 계층 구조의 유형 및 특징을 분석한다.</li><li style="margin-bottom:4px;"><span style="color:#1e40af; font-weight:bold;">[12사문04-02]</span> 현대 사회에서 나타나는 다양한 사회 불평등 양상을 분석하고, 차별받는 사람들의 입장에 대한 공감을 바탕으로 다양한 불평등 현상에 대한 해결 방안을 모색한다.</li><li style="margin-bottom:4px;"><span style="color:#1e40af; font-weight:bold;">[12사문04-03]</span> 복지 국가의 발전 과정에 대한 이해를 바탕으로 사회 복지 제도의 유형과 특징을 비교하고, 현대 사회에서 나타나고 있는 사회 복지를 둘러싼 쟁점을 토론한다.</li></ul><hr><p style="font-size:12px; color:#64748b;">각 성취기준에는 A~E의 성취수준이 있으며, 높은 수준일수록 개념을 다양한 사례에 적용하고 분석·평가하는 능력을 보여줍니다. 답안에 주장·근거·구체적 사례를 함께 담아보세요!</p>`
            }
        };
        const DEFAULT_SUBJECT = '통합사회';

        /* ═════════════════════════════════
           2. Firebase 초기화
        ═════════════════════════════════ */
        const firebaseConfig = {
            apiKey: "AIzaSyDArJnFmo2Ma9EFbGeHCL39IQap6dOzcOM",
            authDomain: "homework-monitor-57f4b.firebaseapp.com",
            databaseURL: "https://homework-monitor-57f4b-default-rtdb.firebaseio.com",
            projectId: "homework-monitor-57f4b",
            storageBucket: "homework-monitor-57f4b.firebasestorage.app",
            messagingSenderId: "692470692095",
            appId: "1:692470692095:web:da383ef62a3bd45a23b4ca"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        /* ═════════════════════════════════
           3. 과목 결정 및 화면 초기화
        ═════════════════════════════════ */
        const urlParams = new URLSearchParams(window.location.search);
        const requestedSubject = urlParams.get('subject');
        const currentSubject = SUBJECT_DATA[requestedSubject] ? requestedSubject : DEFAULT_SUBJECT;

        document.getElementById('subject-display').textContent = currentSubject;

        // Firebase 키에 쓸 수 없는 문자 제거 (교사 페이지와 동일한 규칙이어야 함)
        function sanitizeKey(str) {
            return String(str).replace(/[.#$\[\]\/\s]/g, '_');
        }
        const subjKey = sanitizeKey(currentSubject);

        /* ═════════════════════════════════
           3-1. 문항 불러오기 & 문항 탭
           - 교사가 저장한 문항(questions/{과목})이 있으면 그것을,
             없으면 기본 예시 문항 3개를 사용
           - 문항을 오가도 쓰던 내용이 사라지지 않게 임시 저장(draft)
        ═════════════════════════════════ */
        let questions = SUBJECT_DATA[currentSubject].defaultQuestions.slice();
        let currentQ = 0;                       // 현재 선택된 문항 번호 (0부터)
        const drafts = {};                      // 문항별 작성 중 내용 임시 저장
        const submittedQ = new Set();           // 이번 접속에서 제출 완료한 문항

        const STEP_IDS = ['step1', 'step2', 'step3', 'step4', 'step5'];

        function saveDraft() {
            drafts[currentQ] = {
                steps: STEP_IDS.map((id) => document.getElementById(id).value),
                answer: document.getElementById('student-answer').value,
                manual: manualEditMode
            };
            saveDraftToCloud(currentQ);
        }

        // 쓰는 중간중간 계정에 자동 저장 (0.8초 뒤 한 번에 저장해 서버 부담 최소화)
        let draftSaveTimer = null;
        function saveDraftToCloud(qIndex) {
            if (!currentUid) return;
            clearTimeout(draftSaveTimer);
            draftSaveTimer = setTimeout(() => {
                const d = drafts[qIndex]
                    ? Object.assign({}, drafts[qIndex], { savedAt: firebase.database.ServerValue.TIMESTAMP })
                    : null;
                database.ref(`students/${currentUid}/drafts/${subjKey}/q${qIndex}`)
                    .set(d)
                    .catch(() => { });
            }, 800);
        }

        function loadDraft(qIndex) {
            const d = drafts[qIndex] || { steps: ['', '', '', '', ''], answer: '', manual: false };
            STEP_IDS.forEach((id, i) => { document.getElementById(id).value = d.steps[i] || ''; });
            document.getElementById('student-answer').value = d.answer;
            manualEditMode = d.manual;
            document.getElementById('edit-notice').style.display = d.manual ? 'block' : 'none';
        }

        function renderQuestion() {
            document.getElementById('question-text').textContent =
                `[문항 ${currentQ + 1}] ${questions[currentQ]}`;

            const tabs = document.getElementById('question-tabs');
            tabs.innerHTML = '';
            questions.forEach((q, i) => {
                const btn = document.createElement('button');
                btn.className = 'q-tab' + (i === currentQ ? ' active' : '') + (submittedQ.has(i) ? ' done' : '');
                btn.textContent = `문항 ${i + 1}`;
                btn.addEventListener('click', () => {
                    if (i === currentQ) return;
                    saveDraft();       // 지금 쓰던 내용 저장
                    currentQ = i;
                    loadDraft(i);      // 그 문항에서 쓰던 내용 복원
                    renderQuestion();
                });
                tabs.appendChild(btn);
            });
        }

        // 시험 모드: lock = 이탈 감지 켬 / free = 검색 허용 (교사가 실시간 전환)
        let examMode = 'lock';

        // 교사가 문항·시험 모드를 저장/수정하면 학생 화면에도 실시간 반영
        database.ref(`questions/${subjKey}`).on('value', (snap) => {
            const data = snap.val();
            if (data && Array.isArray(data.items) && data.items.length > 0) {
                questions = data.items.filter((q) => q && q.trim()).slice(0, 10);
            } else {
                questions = SUBJECT_DATA[currentSubject].defaultQuestions.slice();
            }
            if (currentQ >= questions.length) currentQ = 0;
            renderQuestion();

            // 시험 모드 반영
            const newMode = (data && data.examMode === 'free') ? 'free' : 'lock';
            if (newMode !== examMode) {
                examMode = newMode;
                if (examMode === 'free') {
                    // 검색 허용으로 바뀌면 경고 상태를 정리
                    isAway = false;
                    clearTimeout(bannerTimer);
                    document.getElementById('warning-banner').classList.remove('show');
                }
                updateStatusPill();
                if (isLoggedIn) reportFocusState();
            }
        });

        renderQuestion();

        /* ═════════════════════════════════
           4. 구글 로그인 (새로고침 시 로그인 유지)
        ═════════════════════════════════ */
        let isLoggedIn = false;
        let currentUid = null;   // 구글 계정 고유번호 — 같은 계정이면 언제 다시 들어와도 같은 값

        function showQuizScreen(user) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');
            currentUid = user.uid;
            isLoggedIn = true;
            forceEnded = false;   // 교사 종료 후 재로그인 시 정상 응시 가능하도록 초기화

            // ① 이전에 저장해 둔 학생 정보(학년·반·번호·본명)가 있으면 자동으로 채움
            database.ref(`students/${currentUid}/profile`).once('value').then((snap) => {
                const p = snap.val();
                if (p) {
                    if (p.grade) document.getElementById('s-grade').value = p.grade;
                    if (p.class) document.getElementById('s-class').value = p.class;
                    if (p.number) document.getElementById('s-number').value = p.number;
                    document.getElementById('s-name').value = p.name || user.displayName || '';
                } else {
                    // 처음 접속: 구글 이름을 참고로 넣어주되, 본명으로 고쳐 쓸 수 있음
                    document.getElementById('s-name').value = user.displayName || '';
                }
                syncSession();
            }).catch(() => {
                document.getElementById('s-name').value = user.displayName || '';
                syncSession();
            });

            // ② 이 과목에서 쓰다 만 답안(임시저장)과 제출 완료(✓) 표시 복원
            restoreSavedWork();
        }

        function restoreSavedWork() {
            if (!currentUid) return;
            // 교사가 데이터를 초기화한 시각(resetAt)을 먼저 확인 →
            // 그 이전에 저장된 글·제출표시는 무시하고 새로 시작
            database.ref(`questions/${subjKey}/resetAt`).once('value').then((rSnap) => {
                const resetAt = Number(rSnap.val() || 0);

                database.ref(`students/${currentUid}/drafts/${subjKey}`).once('value').then((snap) => {
                    const saved = snap.val() || {};
                    Object.entries(saved).forEach(([k, v]) => {
                        const qi = Number(k.replace('q', ''));
                        if (Number.isNaN(qi) || !v) return;
                        if (resetAt && Number(v.savedAt || 0) < resetAt) return;
                        drafts[qi] = v;
                    });
                    loadDraft(currentQ);
                }).catch(() => { /* 복원 실패 시 새로 작성 */ });

                database.ref(`students/${currentUid}/submitted/${subjKey}`).once('value').then((snap) => {
                    const done = snap.val() || {};
                    Object.entries(done).forEach(([k, v]) => {
                        const t = (v === true) ? 0 : Number(v || 0);   // 예전 버전은 true로 저장됨
                        if (resetAt && t < resetAt) return;
                        submittedQ.add(Number(k));
                    });
                    renderQuestion();
                }).catch(() => { });
            }).catch(() => { });
        }

        // 학생 정보를 계정에 저장 → 다음 접속 때 자동으로 채워짐
        function saveProfile() {
            if (!currentUid) return;
            const { grade, sClass, num, name } = getStudentInfo();
            database.ref(`students/${currentUid}/profile`).update({
                grade: grade, class: sClass, number: num, name: name,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            }).catch(() => { });
        }

        auth.onAuthStateChanged((user) => {
            if (user) showQuizScreen(user);
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => showQuizScreen(result.user))
                .catch((err) => alert('로그인 오류: ' + err.message));
        });

        /* ═════════════════════════════════
           5. 시험 이탈 감지 (핵심 기능 ①)
           - 다른 탭/프로그램으로 전환 (visibilitychange, blur)
           → 학생: 빨간 경고 배너 표시
           → 교사: 대시보드에 빨간불 + 누적 횟수 실시간 전송
        ═════════════════════════════════ */
        let isAway = false;
        let awayCount = 0;
        let sessionRef = null;      // 현재 학생의 세션 노드
        let bannerTimer = null;

        function getStudentInfo() {
            return {
                grade: document.getElementById('s-grade').value.trim(),
                sClass: document.getElementById('s-class').value.trim(),
                num: document.getElementById('s-number').value.trim(),
                name: document.getElementById('s-name').value.trim()
            };
        }

        function getStudentKey() {
            const { grade, sClass, num, name } = getStudentInfo();
            if (!grade || !sClass || !num || !name) return null;
            return sanitizeKey(`${grade}학년-${sClass}-${num}번_${name}`);
        }

        // 학생 정보가 바뀔 때마다 세션 노드를 (재)등록
        let forceEnded = false;             // 교사가 시험을 종료시켰는지
        let attachedSessionPath = null;     // 종료 신호 감시가 붙어있는 세션 경로

        function syncSession() {
            if (!isLoggedIn || forceEnded) return;
            const key = getStudentKey();
            if (!key) return;

            const newRef = database.ref(`sessions/${subjKey}/${key}`);
            const isNewPath = attachedSessionPath !== newRef.toString();

            // 학번 정보가 바뀌어 키가 달라졌다면 이전 세션 정리
            if (sessionRef && sessionRef.toString() !== newRef.toString()) {
                sessionRef.onDisconnect().cancel();
                sessionRef.child('forceLogout').off();
                sessionRef.remove();
            }
            sessionRef = newRef;

            const { grade, sClass, num, name } = getStudentInfo();
            const payload = {
                grade: grade,
                class: sClass,
                number: num,
                name: name,
                focusState: isAway ? 'away' : 'active',
                awayCount: awayCount,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            };
            // 새로 등록할 때는 예전에 남아있던 종료 신호를 지우고 시작
            if (isNewPath) payload.forceLogout = null;
            sessionRef.update(payload);

            // 창을 닫거나 인터넷이 끊기면 자동으로 '접속종료' 처리
            sessionRef.onDisconnect().update({
                focusState: 'offline',
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            });

            // 교사가 [⏹ 접속 종료]를 누르면 즉시 로그아웃되도록 감시
            if (isNewPath) {
                attachedSessionPath = newRef.toString();
                sessionRef.child('forceLogout').on('value', (snap) => {
                    if (snap.val() === true) endByTeacher();
                });
            }
        }

        // 교사가 시험을 종료시켰을 때: 자동 로그아웃 + 첫 화면으로
        function endByTeacher() {
            if (forceEnded) return;
            forceEnded = true;
            isLoggedIn = false;
            if (sessionRef) {
                sessionRef.onDisconnect().cancel();
                sessionRef.child('forceLogout').off();
            }
            attachedSessionPath = null;
            clearTimeout(bannerTimer);
            document.getElementById('warning-banner').classList.remove('show');
            auth.signOut().catch(() => { });
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            alert('선생님이 시험을 종료했습니다. 수고했어요! 🙌\n작성 중이던 내용은 임시저장되어 있어서, 다음에 로그인하면 이어서 쓸 수 있습니다.');
        }

        ['s-grade', 's-class', 's-number', 's-name'].forEach((id) => {
            document.getElementById(id).addEventListener('change', () => {
                syncSession();
                saveProfile();   // 다음에 다시 들어와도 그대로 채워지도록 계정에 저장
            });
        });

        function reportFocusState() {
            if (!sessionRef) return; // 학번 미입력 시에는 화면 경고만 (횟수는 로컬 누적 후 입력 시 반영)
            sessionRef.update({
                focusState: isAway ? 'away' : 'active',
                awayCount: awayCount,
                lastAwayAt: isAway ? firebase.database.ServerValue.TIMESTAMP : null,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function updateStatusPill() {
            const pill = document.getElementById('focus-status');
            const text = document.getElementById('focus-status-text');
            if (examMode === 'free') {
                pill.classList.remove('away');
                text.textContent = '🔍 검색 허용 모드';
                return;
            }
            if (isAway) {
                pill.classList.add('away');
                text.textContent = `이탈 감지 (${awayCount}회)`;
            } else {
                pill.classList.remove('away');
                text.textContent = awayCount > 0 ? `응시 중 (이탈 ${awayCount}회)` : '응시 중';
            }
        }

        function goAway() {
            if (!isLoggedIn || isAway) return;
            if (examMode === 'free') return;   // 검색 허용 모드: 화면을 나가도 이탈로 세지 않음
            isAway = true;
            awayCount++;

            // 학생 화면 경고 배너
            document.getElementById('away-count-display').textContent = awayCount;
            document.getElementById('warning-banner').classList.add('show');
            clearTimeout(bannerTimer);

            updateStatusPill();
            reportFocusState(); // 교사 대시보드로 즉시 전송 → 빨간불
        }

        function comeBack() {
            if (!isLoggedIn || !isAway) return;
            isAway = false;

            // 배너는 3초 뒤에 내려서 경고를 확실히 인지시킴
            clearTimeout(bannerTimer);
            bannerTimer = setTimeout(() => {
                document.getElementById('warning-banner').classList.remove('show');
            }, 3000);

            updateStatusPill();
            reportFocusState();
        }

        // 다른 탭으로 전환하거나 브라우저를 최소화한 경우에만 이탈로 기록
        document.addEventListener('visibilitychange', () => {
            document.hidden ? goAway() : comeBack();
        });
        // ※ blur(창 초점 잃음)는 제출 확인창·화상 키보드가 뜰 때도 반응해
        //    억울한 이탈이 생기므로 세지 않음 (visibilitychange만 사용)
        // ※ 마우스 커서가 창 밖으로 살짝 나가는 것(mouseleave)도
        //    너무 예민해서 이탈로 세지 않음 (억울한 경고 방지)

        /* ═════════════════════════════════
           6. 단계별 가이드(5단계) → 최종 답안 자동 결합
           각 단계 사이에 어울리는 연결어를 자동으로 넣어줌
           (직접 수정 시작 후에는 덮어쓰지 않음)
        ═════════════════════════════════ */
        const answerBox = document.getElementById('student-answer');
        let manualEditMode = false;

        // 각 단계 앞에 붙일 연결어 (1단계는 연결어 없음)
        const STEP_CONNECTORS = ['', '왜냐하면', '예를 들어', '반면에', '따라서'];

        function autoCombine() {
            if (manualEditMode) return;
            const parts = STEP_IDS.map((id) => document.getElementById(id).value.trim());
            let combined = '';
            parts.forEach((text, i) => {
                if (!text) return;
                if (combined) {
                    combined += STEP_CONNECTORS[i] ? ` ${STEP_CONNECTORS[i]} ${text}` : ` ${text}`;
                } else {
                    combined = text;
                }
            });
            answerBox.value = combined;
        }

        STEP_IDS.forEach((id) => {
            document.getElementById(id).addEventListener('input', () => {
                autoCombine();
                saveDraft();   // 쓰는 즉시 임시저장 → 재접속해도 이어쓰기 가능
            });
        });

        answerBox.addEventListener('input', () => {
            if (!manualEditMode) {
                manualEditMode = true;
                document.getElementById('edit-notice').style.display = 'block';
            }
            saveDraft();
        });

        /* ═════════════════════════════════
           7. 연결어 배지 (커서 위치에 삽입)
        ═════════════════════════════════ */
        document.querySelectorAll('.connector-badge').forEach((badge) => {
            badge.addEventListener('click', () => {
                const word = badge.textContent;
                const start = answerBox.selectionStart ?? answerBox.value.length;
                const end = answerBox.selectionEnd ?? answerBox.value.length;
                const before = answerBox.value.slice(0, start);
                const after = answerBox.value.slice(end);
                const spacer = before && !before.endsWith(' ') ? ' ' : '';
                answerBox.value = before + spacer + word + ' ' + after;
                const cursor = (before + spacer + word + ' ').length;
                answerBox.setSelectionRange(cursor, cursor);
                answerBox.focus();
                answerBox.dispatchEvent(new Event('input'));
            });
        });

        /* ═════════════════════════════════
           8. 성취기준 모달
        ═════════════════════════════════ */
        document.getElementById('standard-btn').addEventListener('click', () => {
            const subj = SUBJECT_DATA[currentSubject];
            document.getElementById('modal-body').innerHTML = subj.levelsData
                ? buildAchievementHtml(currentSubject, subj.levelsData)
                : subj.standardHtml;
            document.querySelector('#standard-modal .modal-content').scrollTop = 0;
            document.getElementById('standard-modal').classList.remove('hidden');
        });
        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('standard-modal').classList.add('hidden');
        });
        document.getElementById('standard-modal').addEventListener('click', (e) => {
            if (e.target.id === 'standard-modal') e.target.classList.add('hidden');
        });

        /* ═════════════════════════════════
           9. 최종 답안 제출 (핵심 기능 ②: 데이터 누적)
           - evaluations/{과목}/{학생키}/info : 학생 기본 정보
           - evaluations/{과목}/{학생키}/submissions : push()로 제출 이력 누적
             → 재제출해도 이전 답안이 사라지지 않고 모두 보존됨
        ═════════════════════════════════ */
        document.getElementById('submit-btn').addEventListener('click', () => {
            const { grade, sClass, num, name } = getStudentInfo();
            const answer = answerBox.value.trim();

            if (!grade || !sClass || !num) {
                alert('학년, 반, 번호를 모두 입력해 주세요!');
                return;
            }
            if (!answer) {
                alert('답안이 비어 있습니다. 내용을 작성한 뒤 제출해 주세요!');
                return;
            }
            if (!confirm('답안을 제출하시겠습니까? 제출 후에는 선생님 모니터로 바로 전송됩니다.')) {
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 제출 중...';

            const studentKey = getStudentKey();
            const baseRef = database.ref(`evaluations/${subjKey}/${studentKey}`);

            const infoUpdate = baseRef.child('info').update({
                grade: grade,
                class: sClass,
                number: num,
                name: name,
                subject: currentSubject
            });

            const submissionPush = baseRef.child('submissions').push({
                questionNo: currentQ + 1,                 // 몇 번 문항에 대한 답인지
                questionText: questions[currentQ],        // 문항 내용 (채점 기준으로 사용)
                answer: answer,
                status: '채점대기',
                score: '계산중...',
                feedback: '인공지능 교사가 서술형 내용을 분석하고 있습니다.',
                awayCountAtSubmit: awayCount,     // 제출 시점까지의 이탈 횟수도 함께 기록
                submittedAt: firebase.database.ServerValue.TIMESTAMP
            });

            Promise.all([infoUpdate, submissionPush]).then(() => {
                submittedQ.add(currentQ);          // 문항 탭에 제출 완료(✓) 표시
                if (currentUid) {
                    database.ref(`students/${currentUid}/submitted/${subjKey}/${currentQ}`)
                        .set(firebase.database.ServerValue.TIMESTAMP).catch(() => { });
                }
                saveDraft();
                renderQuestion();
                alert(`문항 ${currentQ + 1} 답안 제출 완료! 선생님 모니터로 전송되었습니다.\n(재제출 시 이전 답안도 함께 보관됩니다.)`);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 최종 답안 제출하기';
            }).catch((err) => {
                alert('제출에 실패했습니다. 잠시 후 다시 시도해 주세요.\n(' + err.message + ')');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 최종 답안 제출하기';
            });
        });
    </script>
</body>
